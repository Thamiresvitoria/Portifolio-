<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acompanhe a jornada da Turma 130 pelas unidades curriculares do curso de Desenvolvimento Front-End.">
  <meta name="theme-color" content="#090c0d">
  <link rel="icon" href="../Assets/Logo_navbar.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <title>Roadmap | Turma 130</title>
</head>

<body>
  <header>
    <nav aria-label="Navegação principal">
      <div class="logo"><a href="../index.html" aria-label="Ir para o início"><img id="logo_navbar_img" src="../Assets/Logo_navbar.svg" alt="Transforme-se — Turma 130"></a></div><button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu" aria-controls="menuList" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="menu" id="menuList">
        <li><a href="../index.html">Início</a></li>
        <li><a href="./turma.html">Turma</a></li>
        <li><a href="./docente.html">Docente</a></li>
        <li><a href="./grade.html">Grade</a></li>
        <li><a href="./roadmap.html" aria-current="page">Roadmap</a></li>
        <li><a href="./estudantes.html">Estudantes</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">

    <section class="title-section" aria-labelledby="titulo-roadmap">
      <h1 id="titulo-roadmap">ROADMAP</h1>
      <p>Selecione uma etapa para conhecer o aprendizado e o destaque.</p>
    </section>
    <section class="roadmap" aria-label="Jornada das unidades curriculares">
      <button class="step" type="button" data-unit="uc1"><span class="step-icon"><i class="fa-solid fa-laptop" aria-hidden="true"></i></span><strong>UC1</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Sistemas e aplicativos</p>
      </button>
      <button class="step" type="button" data-unit="uc2"><span class="step-icon"><i class="fa-solid fa-code" aria-hidden="true"></i></span><strong>UC2</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Sistemas de informação</p>
      </button>
      <button class="step" type="button" data-unit="uc3"><span class="step-icon"><i class="fa-solid fa-pen-ruler" aria-hidden="true"></i></span><strong>UC3</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Projetos para web</p>
      </button>
      <button class="step" type="button" data-unit="uc4"><span class="step-icon"><i class="fa-solid fa-window-maximize" aria-hidden="true"></i></span><strong>UC4</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Aplicações web</p>
      </button>
      <button class="step" type="button" data-unit="uc5"><span class="step-icon"><i class="fa-solid fa-laptop-code" aria-hidden="true"></i></span><strong>UC5</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Codificação Front-End</p>
      </button>
      <button class="step" type="button" data-unit="uc6"><span class="step-icon"><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i></span><strong>UC6</strong><span class="status concluido">CONCLUÍDO</span>
        <p>Publicação web</p>
      </button>
      <div class="step step-pending" aria-label="UC7, Projeto Integrador — Desenvolvedor Front-End, em desenvolvimento">
        <span class="step-icon"><i class="fa-solid fa-diagram-project" aria-hidden="true"></i></span><strong>UC7</strong><span class="status desenvolvimento">EM
          DESENVOLVIMENTO</span>
        <p>Projeto Integrador — Desenvolvedor Front-End</p>
      </div>
    </section>

    <section class="details-card" tabindex="0" aria-label="Detalhes da unidade selecionada" hidden>

      <button class="arrow left" type="button" aria-label="Unidade anterior"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>

      <div class="uc-information">
        <div class="details-icon"><i class="fa-solid fa-laptop" aria-hidden="true"></i></div>
        <div class="details-text"><span class="uc-number"></span>
          <h2></h2><span class="status concluido"></span>
          <p></p>
        </div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <div class="student-highlight">
        <div class="highlight-title"><i class="fa-regular fa-star" aria-hidden="true"></i><span>DESTAQUE — VOTO DA
            TURMA</span></div>
        <div class="student-content">
          <div class="student-photo"><img alt=""></div>
          <div class="student-info">
            <h3></h3>
            <p></p>
          </div>
        </div>
      </div>

      <button class="arrow right" type="button" aria-label="Próxima unidade"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
      
    </section>
  </main>
  <footer>
    <div class="footer-logos"><a href="https://www.pe.senac.br/" class="footer-logo-link" target="_blank" rel="noopener noreferrer"><img src="../Assets/logo_senac.png" alt="Senac Pernambuco"></a><a href="https://www.serasaexperian.com.br/" class="footer-logo-link" target="_blank" rel="noopener noreferrer"><img src="../Assets/logo_serasa_experian.webp" alt="Serasa Experian"></a><a href="https://www.serasaexperian.com.br/transforme-se/" class="footer-logo-link" target="_blank" rel="noopener noreferrer"><img src="../Assets/logo_comunidade_transforme_se.png" alt="Comunidade Transforme-se"></a></div>
    <p>© 2026 Transforme-se 130. Todos os direitos reservados.</p>
  </footer>
  <script src="../script.js" defer></script>
  <script src="../roadmap.js" defer></script>
</body>

</html>
